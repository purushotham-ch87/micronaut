#Tue Jul 21 15:54:24 UTC 2026
micronaut.application.name=mm-cloud-keyclock

micronaut.server.port=8081

# Enable security
micronaut.security.enabled=true

# JWT validation
micronaut.security.token.jwt.enabled=true

micronaut.security.authentication=bearer

# Validate issuer
micronaut.security.token.jwt.claims-validators.issuer=http://localhost:8080/realms/shree-dev

# Download public keys from Keycloak (JWKS)
micronaut.security.token.jwt.signatures.jwks.keycloak.url=http://localhost:8080/realms/shree-dev/protocol/openid-connect/certs

logger.level.io.micronaut.security=DEBUG




# Enable Prometheus metrics
micronaut.metrics.enabled=true
micronaut.metrics.export.prometheus.enabled=true

# Enable Prometheus endpoints
endpoints.all.enabled=true
endpoints.all.path=/
endpoints.endpoints.enabled=true
endpoints.endpoints.sensitive=false
endpoints.prometheus.enabled=true
endpoints.prometheus.sensitive=false

endpoints.health.enabled=true
endpoints.info.enabled=true

# Allow anonymous access to Prometheus metrics
micronaut.security.intercept-url-map[0].pattern=/prometheus
micronaut.security.intercept-url-map[0].http-method=GET
micronaut.security.intercept-url-map[0].access[0]=isAnonymous()

# Allow anonymous access to Endpoints
micronaut.security.intercept-url-map[1].pattern=/endpoints/**
micronaut.security.intercept-url-map[1].http-method=GET
micronaut.security.intercept-url-map[1].access[0]=isAnonymous()

# Allow anonymous access to health
micronaut.security.intercept-url-map[2].pattern=/health
micronaut.security.intercept-url-map[2].http-method=GET
micronaut.security.intercept-url-map[2].access[0]=isAnonymous()

# Allow anonymous access to Endpoints
micronaut.security.intercept-url-map[3].pattern=/info
micronaut.security.intercept-url-map[3].http-method=GET
micronaut.security.intercept-url-map[3].access[0]=isAnonymous()